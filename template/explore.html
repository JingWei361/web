<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Travaler - 探索景點</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>

<body class="bg-slate-50 text-slate-800">
    <nav id="nav-app" class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="/" class="text-2xl font-bold text-blue-600">AI Travaler</a>
            <nav class="bg-white shadow-sm sticky top-0 z-50">
                <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
                    <div class="space-x-6 font-medium">
                        <a href="/" class="text-blue-600">首頁</a>
                        <a href="/planner" class="hover:text-blue-600">行程規劃</a>
                        <a href="/explore" class="hover:text-blue-600">探索景點</a>
                        <a href="/favorites" class="hover:text-blue-600">我的收藏</a>
                        <a href="/about" class="hover:text-blue-600">關於我們</a>
                        {% if not user %}
                        <a href="/login" class="hover:text-blue-600">登入</a>
                        <a href="/register" class="hover:text-blue-600">註冊</a>
                        {% else %}
                        <span>歡迎, {{ name }}</span>
                        <a href="/logout" class="hover:text-blue-600">登出</a>
                        {% endif %}
                    </div>
                </div>
            </nav>
        </div>
    </nav>

    <div id="app">
        <section class="max-w-5xl mx-auto px-4 py-12">
            <h2 class="text-3xl font-bold mb-8">熱門推薦景點</h2>
            {% raw %}
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                <div v-for="spot in exploreSpots" :key="spot.name"
                    class="bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition">
                    <div class="h-48 bg-slate-200 flex items-center justify-center text-4xl">{{ spot.emoji }}</div>
                    <div class="p-4">
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="font-bold text-lg">{{ spot.name }}</h3>
                            <button @click="toggleFavorite(spot)" class="text-red-400 text-xl">{{ isFavorite(spot) ?
                                '❤️' : '♡' }}</button>
                        </div>
                        <p class="text-slate-500 text-sm mb-4">{{ spot.desc }}</p>
                        <span class="bg-slate-100 px-2 py-1 rounded text-xs text-slate-400"># {{ spot.tag }}</span>
                    </div>
                </div>
            </div>
            {% endraw %}
        </section>
    </div>

    <script>
        Vue.createApp({
            setup() {
                const favCount = Vue.ref(0);
                const refresh = () => {
                    const data = localStorage.getItem('my_travel_favorites');
                    favCount.value = data ? JSON.parse(data).length : 0;
                };
                Vue.onMounted(refresh);
                window.addEventListener('fav-updated', refresh);
                return { favCount };
            }
        }).mount('#nav-app');

        Vue.createApp({
            setup() {
                const favorites = Vue.ref([]);
                const exploreSpots = Vue.ref([]);
                const loadSpots = async () => {
                    try {
                        const response = await fetch('/api/explore_spots');
                        const data = await response.json();
                        exploreSpots.value = data.spots;
                    } catch (error) {
                        console.error('載入景點失敗:', error);
                        // 備用數據
                        exploreSpots.value = [
                            { name: '淺草寺', emoji: '🏮', tag: '歷史地標', desc: '東京最古老的寺廟。' },
                            { name: '澀谷橫丁', emoji: '🍜', tag: '美食推薦', desc: '匯聚全日本美食。' }
                        ];
                    }
                };
                const toggleFavorite = (spot) => {
                    const idx = favorites.value.findIndex(f => f.name === spot.name);
                    if (idx > -1) favorites.value.splice(idx, 1);
                    else favorites.value.push(spot);
                    localStorage.setItem('my_travel_favorites', JSON.stringify(favorites.value));
                    window.dispatchEvent(new Event('fav-updated'));
                };
                const isFavorite = (spot) => favorites.value.some(f => f.name === spot.name);
                Vue.onMounted(() => {
                    loadSpots();
                    const saved = localStorage.getItem('my_travel_favorites');
                    if (saved) favorites.value = JSON.parse(saved);
                });
                return { exploreSpots, favorites, toggleFavorite, isFavorite };
            }
        }).mount('#app');
    </script>
</body>

</html>

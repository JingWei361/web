<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>註冊 - AI Travaler</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 text-slate-800">
    <div class="min-h-screen flex items-center justify-center py-12">
        <div class="bg-white p-8 rounded-3xl shadow-md w-full max-w-md">
            <h2 class="text-2xl font-bold mb-6 text-center">註冊新帳號</h2>
            <form method="POST">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-slate-600 mb-1">姓名</label>
                    <input type="text" name="name" required
                        class="w-full border border-slate-200 rounded-xl px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-slate-600 mb-1">性別</label>
                    <select name="gender"
                        class="w-full border border-slate-200 rounded-xl px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="male">男</option>
                        <option value="female">女</option>
                        <option value="other">其他</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-slate-600 mb-1">電話</label>
                    <input type="tel" name="phone"
                        class="w-full border border-slate-200 rounded-xl px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-slate-600 mb-1">信箱</label>
                    <input type="email" name="email" required
                        class="w-full border border-slate-200 rounded-xl px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-medium text-slate-600 mb-1">密碼</label>
                    <input type="password" name="password" required
                        class="w-full border border-slate-200 rounded-xl px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <button type="submit"
                    class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition">
                    註冊
                </button>
            </form>
            <p class="text-center mt-4 text-sm text-slate-500">
                已有帳號？ <a href="/login" class="text-blue-600">登入</a>
            </p>
        </div>
    </div>
</body>

</html>

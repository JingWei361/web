<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Travaler - 關於我們</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='responsive.css') }}">
</head>

<body class="bg-slate-50 text-slate-800">
    <header class="site-header">
        <nav class="site-nav">
            <a href="/" class="site-brand text-2xl font-bold text-blue-600">AI Travaler</a>
            <label class="nav-toggle-label" for="nav-toggle" aria-label="開啟導覽選單">☰</label>
            <input class="nav-toggle" id="nav-toggle" type="checkbox">
            <div class="nav-links font-medium">
                <a href="/" class="text-blue-600">首頁</a>
                <a href="/planner" class="hover:text-blue-600">行程規劃</a>
                <a href="/explore" class="hover:text-blue-600">探索景點</a>
                <a href="/recognize" class="hover:text-blue-600">圖片辨識</a>
                <a href="/favorites" class="hover:text-blue-600">我的收藏</a>
                <a href="/about" class="hover:text-blue-600">關於我們</a>
                {% if not user %}
                <a href="/login" class="hover:text-blue-600">登入</a>
                <a href="/register" class="hover:text-blue-600">註冊</a>
                {% else %}
                <span>歡迎, {{ name }}</span>
                <a href="/logout" class="hover:text-blue-600">登出</a>
                {% endif %}
            </div>
        </nav>
    </header>

    <section class="max-w-4xl mx-auto px-4 py-16 text-center">
        <h2 class="text-4xl font-extrabold mb-4">關於我們的專題</h2>
        <p class="text-blue-600 font-medium mb-12">靜宜大學 人工智慧應用學系</p>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <div class="text-4xl mb-4">👨‍💻</div>
                <h4 class="font-bold">組長</h4>
                <p class="text-slate-400 text-xs mt-2">負責:陳璟葳</p>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <div class="text-4xl mb-4">🤖</div>
                <h4 class="font-bold">組員 </h4>
                <p class="text-slate-400 text-xs mt-2">負責：廖姮雅、呂佾蒨</p>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <div class="text-4xl mb-4">🎨</div>
                <h4 class="font-bold">組員</h4>
                <p class="text-slate-400 text-xs mt-2">負責：卓靖螢</p>
            </div>
    </section>

</body>

</html>

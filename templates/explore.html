<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Travaler - 探索景點</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='responsive.css') }}">
</head>

<body class="bg-slate-50 text-slate-800">
    <header class="site-header">
        <nav class="site-nav">
            <a href="/" class="site-brand text-2xl font-bold text-blue-600">AI Travaler</a>
            <label class="nav-toggle-label" for="nav-toggle" aria-label="開啟導覽選單">☰</label>
            <input class="nav-toggle" id="nav-toggle" type="checkbox">
            <div class="nav-links font-medium">
                <a href="/" class="text-blue-600">首頁</a>
                <a href="/planner" class="hover:text-blue-600">行程規劃</a>
                <a href="/explore" class="hover:text-blue-600">探索景點</a>
                <a href="/recognize" class="hover:text-blue-600">圖片辨識</a>
                <a href="/favorites" class="hover:text-blue-600">我的收藏</a>
                <a href="/about" class="hover:text-blue-600">關於我們</a>
                {% if not user %}
                <a href="/login" class="hover:text-blue-600">登入</a>
                <a href="/register" class="hover:text-blue-600">註冊</a>
                {% else %}
                <span>歡迎, {{ name }}</span>
                <a href="/logout" class="hover:text-blue-600">登出</a>
                {% endif %}
            </div>
        </nav>
    </header>

    <div id="app">
        <section class="max-w-5xl mx-auto px-4 py-12">
            <div class="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4">
                <h2 class="text-3xl font-bold">AI 隨機推薦</h2>

                <!-- 新增：類別選擇按鈕 -->
                <div class="flex bg-white p-1 rounded-xl shadow-sm border border-slate-100">
                    <button v-for="cat in categories" :key="cat.id" @click="changeCategory(cat.id)"
                        :class="['px-6 py-2 rounded-lg text-sm font-bold transition', 
                                currentCategory === cat.id ? 'bg-blue-600 text-white shadow-md' : 'text-slate-500 hover:bg-slate-50']">
                        {% raw %}{{ cat.name }}{% endraw %}
                    </button>
                </div>
            </div>

            <!-- 加載狀態 -->
            <div v-if="isLoading" class="flex justify-center py-20">
                <div class="animate-spin rounded-full h-12 w-12 border-4 border-blue-600 border-t-transparent"></div>
            </div>

            {% raw %}
            <div v-else class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                <div v-for="spot in exploreSpots" :key="spot.name"
                    class="bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition group">
                    <div
                        class="h-48 bg-slate-100 flex items-center justify-center text-5xl group-hover:scale-110 transition duration-500">
                        {{ spot.emoji }}
                    </div>
                    <div class="p-5">
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="font-bold text-lg">{{ spot.name }}</h3>
                            <button @click="toggleFavorite(spot)"
                                class="text-red-400 text-xl hover:scale-120 transition">
                                {{ isFavorite(spot) ? '❤️' : '♡' }}
                            </button>
                        </div>
                        <p class="text-slate-500 text-sm mb-4 leading-relaxed">{{ spot.desc }}</p>
                        <div class="flex items-center justify-between">
                            <span class="bg-blue-50 px-2 py-1 rounded text-xs text-blue-500 font-bold"># {{ spot.tag
                                }}</span>
                            <span v-if="spot.rating" class="text-xs text-amber-500 font-bold">⭐ {{ spot.rating }}</span>
                        </div>
                    </div>
                </div>
            </div>
            {% endraw %}

            <!-- 重新推薦按鈕 -->
            <div class="mt-12 text-center">
                <button @click="loadSpots" :disabled="isLoading"
                    class="px-8 py-3 bg-slate-900 text-white rounded-2xl font-bold hover:bg-slate-800 transition shadow-lg active:scale-95 disabled:opacity-50">
                    換一批推薦
                </button>
                {% if not user %}
                <p class="mt-3 text-sm text-slate-500">登入後即可將推薦景點同步到我的收藏。</p>
                {% endif %}
            </div>
        </section>
    </div>

    <script>
        // 頁面內容邏輯
        Vue.createApp({
            setup() {
                const isAuthenticated = {% if user %}true{% else %}false{% endif %};
        const favorites = Vue.ref([]);
        const exploreSpots = Vue.ref([]);
        const isLoading = Vue.ref(false);

        // 類別設定
        const currentCategory = Vue.ref('all');
        const categories = [
            { id: 'all', name: '全部' },
            { id: 'attraction', name: '找景點' },
            { id: 'food', name: '找美食' }
        ];

        const loadFavorites = async () => {
            if (!isAuthenticated) return;
            const response = await fetch('/api/favorites');
            if (response.ok) {
                const data = await response.json();
                favorites.value = data.favorites || [];
            }
        };

        const loadSpots = async () => {
            isLoading.value = true;
            try {
                if (isAuthenticated) {
                    await fetch('/api/search_history', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ searchQuery: currentCategory.value, filters: { category: currentCategory.value } })
                    });
                }
                const response = await fetch(`/api/explore_spots?category=${currentCategory.value}`);
                const data = await response.json();
                exploreSpots.value = data.spots;
            } catch (error) {
                console.error('載入失敗:', error);
                // 測試用備用數據
                exploreSpots.value = [
                    { name: '雷門', emoji: '⛩️', tag: '景點', desc: '充滿歷史感的紅色大燈籠。', rating: 4.8 },
                    { name: '一蘭拉麵', emoji: '🍜', tag: '美食', desc: '豚骨拉麵的經典代表作。', rating: 4.5 },
                    { name: '築地市場', emoji: '🍣', tag: '美食', desc: '最鮮美的海鮮生魚片都在這。', rating: 4.7 }
                ];
            } finally {
                isLoading.value = false;
            }
        };

        const changeCategory = (catId) => {
            currentCategory.value = catId;
            loadSpots();
        };

        const toggleFavorite = async (spot) => {
            if (!isAuthenticated) {
                window.location.href = '/login';
                return;
            }
            const existing = favorites.value.find(f => f.name === spot.name);
            const response = existing
                ? await fetch(`/api/favorites/${existing.recommendationId}`, { method: 'DELETE' })
                : await fetch('/api/favorites', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(spot)
                });
            const data = await response.json();
            if (!response.ok) {
                alert(data.error || '收藏操作失敗');
                return;
            }
            if (existing) {
                favorites.value = favorites.value.filter(f => f.name !== spot.name);
            } else {
                favorites.value.push(data.favorite);
            }
        };

        const isFavorite = (spot) => favorites.value.some(f => f.name === spot.name);

        Vue.onMounted(() => {
            loadSpots();
            loadFavorites();
        });

        return {
            exploreSpots,
            favorites,
            toggleFavorite,
            isFavorite,
            isLoading,
            categories,
            currentCategory,
            changeCategory,
            loadSpots
        };
        }
        }).mount('#app');
    </script>
</body>

</html>

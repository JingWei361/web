<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入 - AI Travaler</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='responsive.css') }}">
</head>

<body class="bg-slate-50 text-slate-800">
    <header class="site-header">
        <nav class="site-nav">
            <a href="/" class="site-brand text-2xl font-bold text-blue-600">AI Travaler</a>
            <label class="nav-toggle-label" for="nav-toggle" aria-label="開啟導覽選單">☰</label>
            <input class="nav-toggle" id="nav-toggle" type="checkbox">
            <div class="nav-links font-medium">
                <a href="/" class="text-blue-600">首頁</a>
                <a href="/planner" class="hover:text-blue-600">行程規劃</a>
                <a href="/explore" class="hover:text-blue-600">探索景點</a>
                <a href="/recognize" class="hover:text-blue-600">圖片辨識</a>
                <a href="/favorites" class="hover:text-blue-600">我的收藏</a>
                <a href="/about" class="hover:text-blue-600">關於我們</a>
                {% if not user %}
                <a href="/login" class="hover:text-blue-600">登入</a>
                <a href="/register" class="hover:text-blue-600">註冊</a>
                {% else %}
                <span>歡迎, {{ name }}</span>
                <a href="/logout" class="hover:text-blue-600">登出</a>
                {% endif %}
            </div>
        </nav>
    </header>

    <div class="min-h-screen flex items-center justify-center">
        <div class="bg-white p-8 rounded-3xl shadow-md w-full max-w-md">
            <h2 class="text-2xl font-bold mb-6 text-center">登入</h2>
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
            <div
                class="mb-4 rounded-xl px-4 py-3 text-sm {{ 'bg-red-50 text-red-700' if category == 'danger' else 'bg-amber-50 text-amber-700' if category == 'warning' else 'bg-blue-50 text-blue-700' }}">
                {{ message }}
            </div>
            {% endfor %}
            {% endif %}
            {% endwith %}
            <form method="POST">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-slate-600 mb-1">信箱</label>
                    <input type="email" name="email" required
                        class="w-full border border-slate-200 rounded-xl px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-medium text-slate-600 mb-1">密碼</label>
                    <input type="password" name="password" required
                        class="w-full border border-slate-200 rounded-xl px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <button type="submit"
                    class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition">
                    登入
                </button>
            </form>
            <p class="text-center mt-4 text-sm text-slate-500">
                還沒有帳號？ <a href="/register" class="text-blue-600">註冊</a>
            </p>
        </div>
    </div>
</body>

</html>

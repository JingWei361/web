<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Travaler - 行程規劃</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        .loading-dots:after {
            content: ' .';
            animation: dots 1.5s steps(5, end) infinite;
        }

        @keyframes dots {

            0%,
            20% {
                content: ' .';
            }

            40% {
                content: ' ..';
            }

            60% {
                content: ' ...';
            }

            80%,
            100% {
                content: '';
            }
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-800">
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="/" class="text-2xl font-bold text-blue-600">AI Travaler</a>
            <div class="space-x-6 font-medium">
                <a href="/" class="text-blue-600">首頁</a>
                <a href="/planner" class="hover:text-blue-600">行程規劃</a>
                <a href="/explore" class="hover:text-blue-600">探索景點</a>
                <a href="/recognize" class="hover:text-blue-600">圖片辨識</a>
                <a href="/favorites" class="hover:text-blue-600">我的收藏</a>
                <a href="/about" class="hover:text-blue-600">關於我們</a>
                {% if not user %}
                <a href="/login" class="hover:text-blue-600">登入</a>
                <a href="/register" class="hover:text-blue-600">註冊</a>
                {% else %}
                <span>歡迎, {{ name }}</span>
                <a href="/logout" class="hover:text-blue-600">登出</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- 保持導航欄不變 -->
<div id="app">
    <section class="max-w-3xl mx-auto px-4 py-12">
        <div class="bg-white p-8 rounded-3xl shadow-md mb-8">
            <h2 class="text-2xl font-bold mb-6">告訴 AI 你的計畫</h2>
            
            <!-- 第一排：目的地 & 天數 -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">目的地</label>
                    <input v-model="form.city" type="text" placeholder="例如：東京、首爾..."
                        class="w-full border border-slate-200 rounded-xl px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">旅行天數</label>
                    <input v-model.number="form.days" type="number" min="1" max="30" placeholder="要玩幾天？"
                        class="w-full border border-slate-200 rounded-xl px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
            </div>

            <!-- 第二排：預算 & 旅行偏好 -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">預算 (TWD)</label>
                    <input v-model.number="form.budget" type="number" placeholder="例如：30000"
                        class="w-full border border-slate-200 rounded-xl px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">旅行風格</label>
                    <select v-model="form.style" class="w-full border border-slate-200 rounded-xl px-4 py-2 outline-none">
                        <option value="balanced">隨意走走</option>
                        <option value="foodie">吃貨行程</option>
                        <option value="nature">自然風景</option>
                        <option value="shopping">血拚購物</option>
                        <option value="culture">文化古蹟</option>
                    </select>
                </div>
            </div>

            <button @click="generateItinerary" :disabled="isGenerating"
                class="w-full bg-slate-900 text-white py-3 rounded-xl font-bold hover:bg-slate-800 transition disabled:bg-slate-300">
                {% raw %}{{ isGenerating ? 'AI 正在計算中...' : '生成行程' }}{% endraw %}
            </button>
        </div>

        <!-- 行程結果區域 (保持原本架構) -->
        <div v-if="isGenerating || itinerary" class="bg-white p-8 rounded-3xl shadow-md">
            <!-- ... 原本的結果顯示代碼 ... -->
        </div>
    </section>
</div>

<script>
    // 頁面內容邏輯
    Vue.createApp({
        setup() {
            const isGenerating = Vue.ref(false);
            const itinerary = Vue.ref(null);
            const favorites = Vue.ref([]);
            
            // 更新 form 物件增加 budget 與 style
            const form = Vue.reactive({ 
                city: '', 
                days: 1, 
                budget: '', 
                style: 'balanced' 
            });

            const generateItinerary = async () => {
                // 檢查目的地與天數
                if (!form.city) return alert('請輸入目的地');
                if (form.days < 1) return alert('請輸入有效天數');
                
                isGenerating.value = true;
                itinerary.value = null;

                try {
                    const response = await fetch('/api/generate_itinerary', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        // 將預算與風格也傳給後端 AI
                        body: JSON.stringify({ 
                            city: form.city, 
                            days: form.days,
                            budget: form.budget,
                            style: form.style
                        })
                    });
                    const data = await response.json();
                    if (response.ok) {
                        itinerary.value = data.itinerary;
                    } else {
                        alert(data.error || '生成失敗');
                    }
                } catch (error) {
                    alert('網路錯誤，請稍後再試');
                }
                isGenerating.value = false;
            };

            const toggleFavorite = (spot) => {
                const idx = favorites.value.findIndex(f => f.name === spot.name);
                if (idx > -1) favorites.value.splice(idx, 1);
                else favorites.value.push(spot);
                localStorage.setItem('my_travel_favorites', JSON.stringify(favorites.value));
                window.dispatchEvent(new Event('fav-updated'));
            };
            const isFavorite = (spot) => favorites.value.some(f => f.name === spot.name);
            
            Vue.onMounted(() => {
                const saved = localStorage.getItem('my_travel_favorites');
                if (saved) favorites.value = JSON.parse(saved);
            });

            return { form, isGenerating, itinerary, toggleFavorite, isFavorite, generateItinerary };
        }
    }).mount('#app');
</script>
